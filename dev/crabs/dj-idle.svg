<svg xmlns="http://www.w3.org/2000/svg" width="144" height="136" viewBox="-3 -5 36 34">
<style>
.run .la{animation:st .5s steps(1) infinite}.run .lb{animation:st .5s steps(1) infinite -.25s}
.run .bd{animation:bob .5s steps(1) infinite -.125s}
.run g{transform-box:fill-box}
@keyframes st{50%{transform:translateY(-1px)}}@keyframes bob{50%{transform:translateY(1px)}}
.c-fable.run{animation:float 1s ease-in-out infinite}
.c-fable.run .la,.c-fable.run .lb,.c-fable.run .bd{animation:none}
.c-fable.run .ant{animation:blink 1s steps(1) infinite}
.c-fable.run .star{animation:blink .5s steps(1) infinite -.25s}
@keyframes float{50%{transform:translateY(-2px)}}@keyframes blink{50%{opacity:.15}}
.c-heavy.run .it{animation:scan 1s steps(1) infinite}
.c-heavy.run .gl{animation:blink 1s steps(1) infinite -.5s}
@keyframes scan{25%{transform:translate(-1px,1px)}50%{transform:translate(-2px,2px)}75%{transform:translate(-1px,1px)}}
.c-careful.run .it{transform-origin:100% 100%;animation:twist .5s ease-in-out infinite}
@keyframes twist{50%{transform:rotate(-35deg)}}
.c-medium.run .pan{transform-origin:0 50%;animation:tilt 1s ease-in-out infinite}
.c-medium.run .egg{animation:flip 1s ease-in-out infinite}
@keyframes tilt{20%,40%{transform:rotate(-12deg)}}@keyframes flip{30%{transform:translateY(-5px) scaleY(-1)}60%{transform:translateY(0)}}
.c-light.run .la{animation-duration:.25s}.c-light.run .lb{animation-duration:.25s;animation-delay:-.125s}
.c-light.run .flag{transform-origin:0 50%;animation:wave .25s steps(1) infinite}
@keyframes wave{50%{transform:skewY(-12deg) scaleX(.85)}}
.c-explore.run .it{transform-origin:50% 100%;animation:fence .5s ease-in-out infinite}
@keyframes fence{50%{transform:rotate(25deg)}}
@media (prefers-reduced-motion: reduce){.run,.run g{animation:none!important}}
</style><style>
.c-wizard.run .wand{transform-origin:50% 100%;animation:wz-wave 1s ease-in-out infinite}
.c-wizard.run .spark{animation:blink .5s steps(1) infinite}
.c-wizard.run .hs{animation:blink 1s steps(1) infinite -.5s}
@keyframes wz-wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(20deg)}}
.c-ninja.run .tail{transform-origin:100% 50%;animation:nj-flut .25s steps(1) infinite}
.c-ninja.run .shu{transform-origin:50% 50%;animation:nj-spin .3s steps(2) infinite}
@keyframes nj-flut{50%{transform:skewY(-15deg) scaleX(.85)}}@keyframes nj-spin{to{transform:rotate(90deg)}}
.c-painter.run .brush{transform-origin:50% 100%;animation:pt-dab .5s ease-in-out infinite}
.c-painter.run .drop{animation:pt-drip 1s linear infinite}
@keyframes pt-dab{50%{transform:rotate(-25deg)}}
@keyframes pt-drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.c-photo .fl{opacity:0}
.c-photo.run .fl{animation:ph-flash 1s steps(1) infinite}
@keyframes ph-flash{0%{opacity:1}12%,100%{opacity:0}}
.c-scientist.run .flask{transform-origin:50% 100%;animation:sc-swirl 1s ease-in-out infinite}
.c-scientist.run .b1{animation:sc-rise 1s linear infinite}.c-scientist.run .b2{animation:sc-rise 1s linear infinite -.5s}
@keyframes sc-swirl{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes sc-rise{0%{transform:translateY(2px);opacity:0}30%{opacity:1}100%{transform:translateY(-3px);opacity:0}}
.c-dj.run .cl,.c-dj.run .cr{transform-origin:50% 50%;animation:dj-bass .5s steps(1) infinite}
.c-dj.run .n1{animation:dj-note 1s linear infinite}.c-dj.run .n2{animation:dj-note 1s linear infinite -.5s}
@keyframes dj-bass{50%{transform:scale(1.2)}}
@keyframes dj-note{0%{transform:translateY(2px);opacity:0}30%{opacity:1}100%{transform:translateY(-4px);opacity:0}}
.c-banker.run .fan{transform-origin:50% 100%;animation:bk-fan .5s ease-in-out infinite}
.c-banker.run .r1,.c-banker.run .r2{transform-origin:50% 50%;animation:bk-fall 1.2s linear infinite}.c-banker.run .r2{animation-delay:-.6s}
.c-banker.run .sh{animation:blink 1s steps(1) infinite}
@keyframes bk-fan{50%{transform:rotate(-20deg)}}
@keyframes bk-fall{0%{transform:translateY(-3px) rotate(-12deg);opacity:0}20%,75%{opacity:1}50%{transform:translateY(3px) rotate(10deg)}100%{transform:translateY(8px) rotate(-8deg);opacity:0}}
</style>
<g transform="translate(0,0) scale(1)" opacity="1" shape-rendering="crispEdges"><g class="c-dj"><g class="bd"><rect x="7" y="10" width="16" height="12" fill="#D97757"/><rect x="3" y="14" width="4" height="4" fill="#D97757"/><rect x="23" y="14" width="4" height="4" fill="#D97757"/><rect x="9" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="19" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="8" y="4" width="14" height="1" fill="#3A3A3C"/><rect x="7" y="5" width="1" height="1" fill="#3A3A3C"/><rect x="22" y="5" width="1" height="1" fill="#3A3A3C"/><rect x="6" y="6" width="1" height="3" fill="#3A3A3C"/><rect x="23" y="6" width="1" height="3" fill="#3A3A3C"/><g class="cl"><rect x="4" y="9" width="3" height="5" fill="#C04DB0"/><rect x="6" y="10" width="1" height="3" fill="#2B2A33"/></g><g class="cr"><rect x="23" y="9" width="3" height="5" fill="#C04DB0"/><rect x="23" y="10" width="1" height="3" fill="#2B2A33"/></g><g class="n1"><rect x="27" y="1" width="1" height="1" fill="#C04DB0"/><rect x="27" y="2" width="1" height="1" fill="#C04DB0"/><rect x="28" y="2" width="1" height="1" fill="#C04DB0"/><rect x="27" y="3" width="1" height="1" fill="#C04DB0"/><rect x="25" y="4" width="1" height="1" fill="#C04DB0"/><rect x="26" y="4" width="1" height="1" fill="#C04DB0"/><rect x="27" y="4" width="1" height="1" fill="#C04DB0"/><rect x="25" y="5" width="1" height="1" fill="#C04DB0"/><rect x="26" y="5" width="1" height="1" fill="#C04DB0"/></g><g class="n2"><rect x="3" y="3" width="1" height="1" fill="#F5C542"/><rect x="3" y="4" width="1" height="1" fill="#F5C542"/><rect x="4" y="4" width="1" height="1" fill="#F5C542"/><rect x="3" y="5" width="1" height="1" fill="#F5C542"/><rect x="1" y="6" width="1" height="1" fill="#F5C542"/><rect x="2" y="6" width="1" height="1" fill="#F5C542"/><rect x="3" y="6" width="1" height="1" fill="#F5C542"/><rect x="1" y="7" width="1" height="1" fill="#F5C542"/><rect x="2" y="7" width="1" height="1" fill="#F5C542"/></g></g><g class="la"><rect x="7" y="22" width="2" height="4" fill="#D97757"/><rect x="17" y="22" width="2" height="4" fill="#D97757"/></g><g class="lb"><rect x="11" y="22" width="2" height="4" fill="#D97757"/><rect x="21" y="22" width="2" height="4" fill="#D97757"/></g></g></g>
</svg>
